[package]
name = "gdl-iroh"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
base64 = "0.22"
getrandom = "0.4"
subtle = "2"

[profile.release]
panic = "unwind"
