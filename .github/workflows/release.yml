name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional tag or commit to package (manual runs never publish)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # All versions share a lock: never build/publish overlapping releases.
  group: release
  cancel-in-progress: false

env:
  VCPKG_DISABLE_METRICS: 1
  RUSTUP_TOOLCHAIN: '1.98.0'

jobs:
  preflight:
    name: Check release eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Manual runs produce CI artifacts only, even when a tag is selected.
      - name: Require a new version before building installers
        if: github.event_name == 'push'
        run: python scripts/publish_release.py --check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}

  installers:
    name: Installer (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release tag against VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/release.py check-tag "${{ github.ref_name }}"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: Build tools
        run: python scripts/setup.py --yes --no-build
      - name: Networking toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Networking license tool
        run: cargo install cargo-about --version 0.9.2 --locked --features cli --jobs 2
      - name: Installer tools
        run: python -m pip install -r scripts/installer/requirements.txt
      - name: Linux wizard runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-shape0 libxcb-keysyms1 libxcb-icccm4 xvfb xauth
      - name: Script and offscreen wizard tests
        run: python -m unittest discover -s tests/scripts -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check installer dependency notices
        run: python scripts/release.py check-installer-tools
      - name: Build, test and package Windows installer
        if: runner.os == 'Windows'
        run: python scripts/release.py build
      - name: Build, test and package Linux installer
        if: runner.os == 'Linux'
        run: python scripts/release.py build
        env:
          CXX: g++-14
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: out/releases/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish versioned release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: installers
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      # Refuse to mutate an existing release; both platform jobs must succeed first.
      - name: Publish verified installers (no game assets)
        run: python scripts/publish_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
