name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      game_data:
        description: "Also run the [assets]/[unpacked] tier on a self-hosted runner that has the game data"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: 1

jobs:
  # A change to documents alone (README, docs/, licences) builds, tests and lints nothing.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify the changed paths
        id: classify
        run: python3 scripts/checks/ci_changes.py --base "$BASE" --head "$HEAD" --output "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}

  windows:
    name: Windows (MSVC)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: Tools
        run: python scripts/setup.py --yes --no-build
      - name: Script tests
        run: python -m unittest discover -s tests/scripts -v
      - name: Build and unit tests
        run: python scripts/build.py --test
      - name: Expansion audio without optional backend
        run: python scripts/checks/expansion_audio.py

  linux:
    name: Linux (GCC)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: Script tests
        run: python3 -m unittest discover -s tests/scripts -v
      - name: Tools, build and unit tests
        run: python3 scripts/setup.py --yes --test
      - name: Expansion audio without optional backend
        run: python3 scripts/checks/expansion_audio.py
      # The GPU tier on a software Vulkan device under a virtual display: best effort, as
      # what lavapipe can do differs between Mesa releases.
      - name: GPU tests (lavapipe under Xvfb)
        continue-on-error: true
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a ctest --preset linux-ninja-debug -L gpu
        env:
          CXX: g++-14

  netplay:
    name: Netplay transport (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\vcpkg\archives
            ~/.cache/vcpkg/archives
          key: netplay-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            netplay-vcpkg-${{ runner.os }}-
            vcpkg-${{ runner.os }}-
      - name: Tools
        run: python scripts/setup.py --yes --no-build
      - name: Rust networking toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Iroh transport processes (no assets or display)
        run: python scripts/netplay/netplay_test.py --build --runs 3
        env:
          RUSTUP_TOOLCHAIN: "1.98.0"
      - name: Iroh adapter tests
        run: |
          cargo fmt --manifest-path src/engine/net/iroh/Cargo.toml --check
          cargo clippy --release --locked --manifest-path src/engine/net/iroh/Cargo.toml --all-targets --jobs 2 -- -D warnings
          cargo test --release --locked --manifest-path src/engine/net/iroh/Cargo.toml --jobs 2
        env:
          RUSTUP_TOOLCHAIN: "1.98.0"
          CARGO_HOME: ${{ github.workspace }}/build/cargo-home
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/netplay/src/engine/net/cargo
      - name: Networking lint tools
        if: runner.os == 'Linux'
        run: python scripts/setup.py --yes --tooling --no-build
      - name: Networking lint
        if: runner.os == 'Linux'
        run: python scripts/lint.py src/engine/net src/game/netplay/HostedRoom.cpp tools/netplaycheck
      - name: Retain network diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netplay-${{ runner.os }}
          path: build/netplay/network-test-*/**/*.log
          if-no-files-found: warn

  # Every unit under the full profile, in eight shards, each starting from the clean
  # results its predecessor saved: a push re-lints only what it reached. The cache is
  # saved whatever the outcome, so a failing shard still keeps the units it cleared.
  lint-shards:
    name: Lint shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: Tools
        run: python3 scripts/setup.py --yes --tooling --no-build
      # clang-tidy parses source; only vcpkg's headers and the compilation database
      # are needed. No C++ modules are used: disable scanning here to avoid references
      # to build-only module maps. Shaders are loaded at runtime, not included in C++.
      - name: Configure lint inputs
        run: |
          python3 scripts/devenv.py -- cmake --preset linux-ninja-debug -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DGDL_ENABLE_NETPLAY=ON
          python3 scripts/devenv.py -- cmake --build --preset linux-ninja-debug --target compile_commands
      - name: Restore clean lint results
        uses: actions/cache/restore@v4
        with:
          path: build/lint-cache
          key: tidy-v2-${{ runner.os }}-${{ strategy.job-total }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: tidy-v2-${{ runner.os }}-${{ strategy.job-total }}-${{ matrix.shard }}-
      - name: clang-tidy
        run: python3 scripts/lint.py --shard-index ${{ matrix.shard }} --shard-count ${{ strategy.job-total }} --cache-dir build/lint-cache
      - name: Save clean lint results
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/lint-cache
          key: tidy-v2-${{ runner.os }}-${{ strategy.job-total }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}

  # Preserve the single required-check name: every shard passed, or nothing to lint.
  lint:
    name: Lint (clang-tidy)
    needs: [changes, lint-shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every lint shard to pass
        run: test "$LINT_RESULT" = success || { test "$CODE" = false && test "$LINT_RESULT" = skipped; }
        env:
          LINT_RESULT: ${{ needs.lint-shards.result }}
          CODE: ${{ needs.changes.outputs.code }}

  # The tier that needs the game data: a self-hosted runner labelled "game-data" with the
  # disc extracted and unpacked, and GDL_ASSET_DIR / GDL_UNPACKED_DIR set in its environment.
  game-data:
    name: Game data tests (self-hosted)
    if: github.event_name == 'workflow_dispatch' && inputs.game_data
    runs-on: [self-hosted, game-data]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Configure against the machine's game data
        shell: bash
        run: |
          preset=$([ "$RUNNER_OS" = "Windows" ] && echo windows-ninja-debug || echo linux-ninja-debug)
          python scripts/devenv.py -- cmake --preset "$preset" \
            -DGDL_ASSET_DIR="$GDL_ASSET_DIR" -DGDL_UNPACKED_DIR="$GDL_UNPACKED_DIR"
      - name: Build and every test
        run: python scripts/build.py --test
      - name: Native asset completeness and behavior gate
        shell: bash
        run: |
          preset=$([ "$RUNNER_OS" = "Windows" ] && echo windows-ninja-debug || echo linux-ninja-debug)
          python scripts/checks/asset_audit.py "$preset" --verify
      - name: Retain asset audit evidence (metadata only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-asset-audit
          path: |
            build/*/asset-audit.json
            build/*/asset-conformance.xml
          if-no-files-found: warn
