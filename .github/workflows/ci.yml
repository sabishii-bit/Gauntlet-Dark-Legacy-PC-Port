name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      game_data:
        description: "Also run the [assets]/[unpacked] tier on a self-hosted runner that has the game data"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: 1

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: Tools
        run: python scripts/setup.py --yes --no-build
      - name: Script tests
        run: python -m unittest discover -s tests/scripts -v
      - name: Build and unit tests
        run: python scripts/build.py --test

  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: Script tests
        run: python3 -m unittest discover -s tests/scripts -v
      - name: Tools, build and unit tests
        run: python3 scripts/setup.py --yes --test
      # The GPU tier on a software Vulkan device under a virtual display: best effort, as
      # what lavapipe can do differs between Mesa releases.
      - name: GPU tests (lavapipe under Xvfb)
        continue-on-error: true
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a ctest --preset linux-ninja-debug -L gpu
        env:
          CXX: g++-14

  lint-shards:
    name: Lint shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: Tools
        run: python3 scripts/setup.py --yes --tooling --no-build
      # clang-tidy parses source; only vcpkg's headers and the compilation database
      # are needed. No C++ modules are used: disable scanning here to avoid references
      # to build-only module maps. Shaders are loaded at runtime, not included in C++.
      - name: Configure lint inputs
        run: |
          python3 scripts/devenv.py -- cmake --preset linux-ninja-debug -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          python3 scripts/devenv.py -- cmake --build --preset linux-ninja-debug --target compile_commands
      - name: clang-tidy
        run: python3 scripts/lint.py --shard-index ${{ matrix.shard }} --shard-count ${{ strategy.job-total }}

  # Preserve the single required-check name, and never accept a failed/skipped shard.
  lint:
    name: Lint (clang-tidy)
    needs: lint-shards
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every lint shard to pass
        run: test "$LINT_RESULT" = success
        env:
          LINT_RESULT: ${{ needs.lint-shards.result }}

  # The tier that needs the game data: a self-hosted runner labelled "game-data" with the
  # disc extracted and unpacked, and GDL_ASSET_DIR / GDL_UNPACKED_DIR set in its environment.
  game-data:
    name: Game data tests (self-hosted)
    if: github.event_name == 'workflow_dispatch' && inputs.game_data
    runs-on: [self-hosted, game-data]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Configure against the machine's game data
        shell: bash
        run: |
          preset=$([ "$RUNNER_OS" = "Windows" ] && echo windows-ninja-debug || echo linux-ninja-debug)
          python scripts/devenv.py -- cmake --preset "$preset" \
            -DGDL_ASSET_DIR="$GDL_ASSET_DIR" -DGDL_UNPACKED_DIR="$GDL_UNPACKED_DIR"
      - name: Build and every test
        run: python scripts/build.py --test
